[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "triptailor-graphrag"
version = "0.1.0"
description = "TripTailor-GraphRAG framework for personalized travel planning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
neo4j = ["neo4j>=5.20.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
